name: kashkool
description: "Kashkool - كشكول: دفتر حسابات ديون العملاء والموردين لأصحاب المحلات"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Local Database
  drift: ^2.24.2
  sqlcipher_flutter_libs: ^0.6.8
  sqlite3: ^2.4.6
  path_provider: ^2.1.5

  # External Links & Media
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  speech_to_text: ^7.0.0

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  cupertino_icons: ^1.0.8
  flutter_local_notifications: ^22.3.3
  pdf: ^3.12.0
  printing: ^5.14.3
  share_plus: ^13.3.1
  image: ">=4.0.0 <4.11.0"
  home_widget: ^0.10.0
  local_auth: ^3.0.2
  crypto: ^3.0.8
  file_picker: ^13.3.2
  archive: ^4.0.2
  path: ^1.9.1
  flutter_secure_storage: ^11.2.0
  device_info_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.3
  drift_dev: ^2.24.2
  custom_lint: ^0.7.1
  riverpod_lint: ^2.6.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/fonts/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo.ttf
